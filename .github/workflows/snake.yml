{"name":"Minhas contribuicoes","on":{"schedule":[{"cron":"0 3 * * *"}],"workflow_dispatch":{},"push":{"branches":["main"]}},"permissions":{"contents":"write"},"jobs":{"gerar":{"runs-on":"ubuntu-latest","timeout-minutes":5,"steps":[{"uses":"actions/github-script@v7","with":{"script":"function svg(weeks,total,dark){const P=dark?{bg:'#1E1519',card:'#2A1D23',txt:'#F6D9E1',sub:'#C9A3AF',empty:'#3B2930',lv:['#6E3A4C','#9E4F66','#C9708A','#F2A7BB']}:{bg:'#FFF6F8',card:'#FFFFFF',txt:'#7A3A4E',sub:'#B07C8C',empty:'#F6E3E9',lv:['#F6C4D1','#EA97AD','#CF6F8B','#9E4F66']};const S=13,G=4,X0=46,Y0=92;const W=X0+weeks.length*(S+G)+30,H=Y0+7*(S+G)+56;let max=0,maxDay=null;weeks.forEach(w=>w.contributionDays.forEach(d=>{if(d.contributionCount>max){max=d.contributionCount;maxDay=d.date}}));const lvl=c=>c===0?-1:max<=4?Math.min(3,c-1):Math.min(3,Math.floor(c/max*4-1e-4));const meses=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];let cells='',labels='',flor='',ultimoMes=-1;weeks.forEach((w,i)=>{const x=X0+i*(S+G);const m=new Date(w.contributionDays[0].date+'T12:00:00').getMonth();if(m!==ultimoMes&&i<weeks.length-2){labels+=`<text x='${x}' y='${Y0-10}' class='m'>${meses[m]}</text>`;ultimoMes=m}w.contributionDays.forEach(d=>{const y=Y0+new Date(d.date+'T12:00:00').getDay()*(S+G);const l=lvl(d.contributionCount);const fill=l<0?P.empty:P.lv[l];const anim=l>=0?` class='on' style='animation-delay:${(i*.025).toFixed(2)}s'`:'';cells+=`<rect x='${x}' y='${y}' width='${S}' height='${S}' rx='4' fill='${fill}'${anim}><title>${d.contributionCount} em ${d.date.split('-').reverse().join('/')}</title></rect>`;if(d.date===maxDay&&max>0)flor=`<g transform='translate(${x+S/2} ${y+S/2})'><g class='flor'>${petals(dark?'#FFD1DC':'#FFFFFF',.95)}</g></g>`})});const dias=['','seg','','qua','','sex',''].map((t,k)=>t?`<text x='${X0-10}' y='${Y0+k*(S+G)+10}' class='m' text-anchor='end'>${t}</text>`:'').join('');const legX=W-30-5*(S+G)-70,legY=Y0+7*(S+G)+22;const leg=`<text x='${legX-8}' y='${legY+10}' class='m' text-anchor='end'>menos</text>`+[P.empty,...P.lv].map((c,k)=>`<rect x='${legX+k*(S+G)}' y='${legY}' width='${S}' height='${S}' rx='4' fill='${c}'/>`).join('')+`<text x='${legX+5*(S+G)+4}' y='${legY+10}' class='m'>mais</text>`;const frase=total===1?'1 contribui\\xe7\\xe3o no \\xfaltimo ano':`${total} contribui\\xe7\\xf5es no \\xfaltimo ano`;return`<svg xmlns='http://www.w3.org/2000/svg' width='${W}' height='${H}' viewBox='0 0 ${W} ${H}' role='img' aria-label='Minhas contribui\\xe7\\xf5es: ${frase}'>\\n<style>\\n.t{font:700 20px 'Segoe UI',Ubuntu,Helvetica,Arial,sans-serif;fill:${P.txt}}\\n.s{font:400 13px 'Segoe UI',Ubuntu,Helvetica,Arial,sans-serif;fill:${P.sub}}\\n.m{font:400 11px 'Segoe UI',Ubuntu,Helvetica,Arial,sans-serif;fill:${P.sub}}\\n.on{opacity:0;animation:aparece .5s ease-out forwards}\\n@keyframes aparece{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}\\n.on{transform-box:fill-box;transform-origin:center}\\n.flor{animation:gira 6s linear infinite;transform-box:fill-box;transform-origin:center}\\n@keyframes gira{to{transform:rotate(360deg)}}\\n.brilho{animation:pisca 2.4s ease-in-out infinite}\\n@keyframes pisca{50%{opacity:.25}}\\n@media (prefers-reduced-motion:reduce){.on{animation:none;opacity:1}.flor,.brilho{animation:none}}\\n</style>\\n<rect width='${W}' height='${H}' rx='18' fill='${P.bg}'/>\\n<g transform='translate(${X0} 38)'>${petals(P.lv[2],.9)}</g>\\n<text x='${X0+18}' y='44' class='t'>Minhas contribui\\xe7\\xf5es</text>\\n<text x='${X0+18}' y='64' class='s'>${frase}</text>\\n<text x='${W-40}' y='42' class='t brilho' text-anchor='end' style='font-size:16px'>\\u2726</text>\\n<text x='${W-58}' y='58' class='t brilho' text-anchor='end' style='font-size:11px;animation-delay:1.2s'>\\u2726</text>\\n${labels}${dias}${cells}${flor}${leg}\\n</svg>`}function petals(c,k=1){let p='';for(let a=0;a<5;a++)p+=`<ellipse cx='0' cy='${-5*k}' rx='${3.2*k}' ry='${5*k}' fill='${c}' transform='rotate(${a*72})'/>`;return p+`<circle r='${2.6*k}' fill='#FFE3A3'/>`}const r=await github.graphql(`query($u:String!){user(login:$u){contributionsCollection{contributionCalendar{totalContributions weeks{contributionDays{date contributionCount}}}}}}`,{u:context.repo.owner});const cal=r.user.contributionsCollection.contributionCalendar;const fs=require('fs');fs.mkdirSync('dist',{recursive:true});fs.writeFileSync('dist/contribuicoes-claro.svg',svg(cal.weeks,cal.totalContributions,false));fs.writeFileSync('dist/contribuicoes-escuro.svg',svg(cal.weeks,cal.totalContributions,true))"}},{"uses":"crazy-max/ghaction-github-pages@v4","with":{"target_branch":"output","build_dir":"dist"},"env":{"GITHUB_TOKEN":"${{ secrets.GITHUB_TOKEN }}"}}]}}}
